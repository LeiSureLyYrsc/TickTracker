    <title>代肝记录系统</title>
    <script>
      // 首帧前根据存储的模式/系统偏好应用暗色，避免闪烁
      (function () {
        try {
          var m = localStorage.getItem('tt_mode')
          var dark =
            m === 'dark' ||
            ((m === 'system' || !m) &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
